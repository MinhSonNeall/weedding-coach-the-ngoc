<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Ảnh chia sẻ thiệp cưới Thế Ngọc & Hương Ly</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f6f4eb;
        color: #193448;
      }
      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
      }
      .border {
        position: absolute;
        inset: 22px;
        border: 1px solid #c7cbbb;
      }
      .background-photo {
        position: absolute;
        top: 0;
        right: 0;
        width: 780px;
        height: 100%;
        object-fit: cover;
        object-position: 50% 68%;
      }
      .background-wash {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          #f6f4eb 0%,
          #f6f4eb 38%,
          #f6f4ebed 47%,
          #f6f4eb10 62%,
          transparent 75%
        );
      }
      .copy {
        position: absolute;
        left: 55px;
        top: 49px;
        width: 603px;
        text-align: center;
      }
      .monogram {
        display: block;
        width: 67px;
        height: 66px;
        object-fit: contain;
        margin: 0 auto 24px;
      }
      .eyebrow {
        margin: 0 0 17px;
        font:
          400 14px/1.5 "Be Vietnam Pro",
          sans-serif;
        letter-spacing: 3px;
      }
      h1 {
        margin: 0;
        font:
          400 85px/1 "Cormorant Garamond",
          Georgia,
          serif;
      }
      h1 span {
        display: block;
        color: #787e52;
        font-size: 39px;
        line-height: 1.2;
        font-style: italic;
      }
      h1 em {
        display: block;
        font-weight: 400;
      }
      .date {
        margin: 26px 0 11px;
        font:
          500 39px/1.2 "Cormorant Garamond",
          Georgia,
          serif;
        letter-spacing: 5px;
      }
      .venue {
        font:
          400 13px/1.8 "Be Vietnam Pro",
          sans-serif;
        letter-spacing: 2px;
        margin: 0;
      }
      .time {
        font:
          400 13px/1.8 "Be Vietnam Pro",
          sans-serif;
        margin: 7px 0 0;
        color: #677455;
      }
      .flower {
        position: absolute;
        width: 127px;
        height: 244px;
        object-fit: contain;
        left: 631px;
        bottom: -22px;
        transform: rotate(-12deg);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        class="background-photo"
        src="../edited/cover.jpg"
        alt="Ảnh nền Thế Ngọc và Hương Ly sánh đôi dưới tán cây"
      />
      <div class="background-wash"></div>
      <div class="border"></div>
      <div class="copy">
        <img class="monogram" src="../stationery/monogram.png" alt="LN" />
        <p class="eyebrow">TRÂN TRỌNG KÍNH MỜI</p>
        <h1>Thế Ngọc<span>&</span><em>Hương Ly</em></h1>
        <p class="date">07 · 11 · 2026</p>
        <p class="venue">HÀ NỘI DAEWOO HOTEL</p>
        <p class="time">Đón khách 17h15 · Khu bể bơi Serenity</p>
      </div>
      <img class="flower" src="../blue-botanical.svg" alt="" />
    </main>
  </body>
</html>
